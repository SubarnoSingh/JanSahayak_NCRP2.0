<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ashoka Emblem / Lion Capital of Ashoka — simplified for web use -->
  <!-- Base / Lotus pedestal -->
  <ellipse cx="100" cy="185" rx="52" ry="8" fill="#c9a84c" opacity="0.3"/>
  <path d="M48 175 C48 175 60 168 100 168 C140 168 152 175 152 175 L148 182 C148 182 138 176 100 176 C62 176 52 182 52 182 Z" fill="#b8942a"/>
  <path d="M52 182 C52 182 64 176 100 176 C136 176 148 182 148 182 L145 188 C145 188 135 182 100 182 C65 182 55 188 55 188 Z" fill="#a07d1f"/>

  <!-- Abacus band -->
  <rect x="50" y="155" width="100" height="14" rx="2" fill="#1e3a5f"/>
  <rect x="52" y="157" width="96" height="10" rx="1" fill="#264a6e"/>
  <!-- Abacus decorations (animals silhouettes) -->
  <circle cx="72" cy="162" r="3" fill="#c9a84c" opacity="0.7"/>
  <circle cx="100" cy="162" r="3" fill="#c9a84c" opacity="0.7"/>
  <circle cx="128" cy="162" r="3" fill="#c9a84c" opacity="0.7"/>

  <!-- Platform above abacus -->
  <rect x="55" y="148" width="90" height="8" rx="1.5" fill="#1e3a5f"/>
  <rect x="58" y="150" width="84" height="4" rx="1" fill="#2a5580"/>

  <!-- Lions body base -->
  <path d="M60 148 L60 90 C60 75 75 60 100 60 C125 60 140 75 140 90 L140 148 Z" fill="#1e3a5f"/>

  <!-- Center lion (front-facing) -->
  <!-- Head -->
  <ellipse cx="100" cy="72" rx="16" ry="14" fill="#264a6e"/>
  <!-- Face -->
  <ellipse cx="100" cy="74" rx="10" ry="9" fill="#c9a84c"/>
  <!-- Eyes -->
  <ellipse cx="95" cy="71" rx="2" ry="2.5" fill="#1e3a5f"/>
  <ellipse cx="105" cy="71" rx="2" ry="2.5" fill="#1e3a5f"/>
  <!-- Nose -->
  <path d="M98 75 L100 78 L102 75" stroke="#1e3a5f" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M96 79 Q100 82 104 79" stroke="#1e3a5f" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Mane -->
  <path d="M84 68 C84 55 92 48 100 48 C108 48 116 55 116 68" stroke="#1e3a5f" stroke-width="3" fill="none"/>
  <path d="M86 72 C84 60 90 50 100 50 C110 50 116 60 114 72" fill="#1e3a5f" opacity="0.3"/>

  <!-- Body front -->
  <path d="M82 86 L82 135 C82 140 90 148 100 148 C110 148 118 140 118 135 L118 86 C118 78 110 72 100 72 C90 72 82 78 82 86 Z" fill="#264a6e"/>
  <!-- Paws -->
  <ellipse cx="90" cy="148" rx="8" ry="4" fill="#1e3a5f"/>
  <ellipse cx="110" cy="148" rx="8" ry="4" fill="#1e3a5f"/>

  <!-- Left lion (partial, side view) -->
  <path d="M55 80 C50 68 55 55 65 50 C68 48 72 48 75 50 L75 80 C75 85 70 88 65 88 C58 88 55 85 55 80 Z" fill="#1e3a5f"/>
  <ellipse cx="65" cy="58" rx="7" ry="6" fill="#c9a84c" opacity="0.5"/>
  <circle cx="63" cy="57" r="1.5" fill="#1e3a5f"/>
  <circle cx="67" cy="57" r="1.5" fill="#1e3a5f"/>

  <!-- Right lion (partial, side view) -->
  <path d="M145 80 C150 68 145 55 135 50 C132 48 128 48 125 50 L125 80 C125 85 130 88 135 88 C142 88 145 85 145 80 Z" fill="#1e3a5f"/>
  <ellipse cx="135" cy="58" rx="7" ry="6" fill="#c9a84c" opacity="0.5"/>
  <circle cx="133" cy="57" r="1.5" fill="#1e3a5f"/>
  <circle cx="137" cy="57" r="1.5" fill="#1e3a5f"/>

  <!-- Ashoka Chakra (wheel) on abacus -->
  <circle cx="100" cy="162" r="5" fill="none" stroke="#c9a84c" stroke-width="1"/>
  <circle cx="100" cy="162" r="1.5" fill="#c9a84c"/>
  <!-- Spokes -->
  <line x1="100" y1="157.5" x2="100" y2="158.5" stroke="#c9a84c" stroke-width="0.8"/>
  <line x1="100" y1="165.5" x2="100" y2="166.5" stroke="#c9a84c" stroke-width="0.8"/>
  <line x1="95.5" y1="162" x2="96.5" y2="162" stroke="#c9a84c" stroke-width="0.8"/>
  <line x1="103.5" y1="162" x2="104.5" y2="162" stroke="#c9a84c" stroke-width="0.8"/>
</svg>
